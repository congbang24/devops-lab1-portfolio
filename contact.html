            border-radius: 8px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;

        .nav-link:hover,

            border-radius: 12px;
            padding: 24px;
            margin: 16px 0;
            text-align: left;
            border-left: 4px solid #4338ca;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin: 14px 0;
            font-size: 15px;
            color: #1e293b;
        }

        .contact-item .icon {
            font-size: 22px;
            margin-right: 12px;
            width: 28px;
            display: inline-block;
        }

        .contact-item a {
            color: #3730a3;
            text-decoration: underline;
            font-weight: 600;
            padding: 4px;
        }

        .contact-item a:hover,
        .contact-item a:focus-visible {
            color: #1e1b4b;
            outline: 2px solid #4338ca;
            border-radius: 4px;
        }
