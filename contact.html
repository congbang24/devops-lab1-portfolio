<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Liên hệ - DevOps Lab 1 - Nguyễn Công Bằng">
    <title>Liên hệ — DevOps Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        /* Navigation */
        .navbar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #edf2f7;
        }

        .nav-link {
            text-decoration: none;
            color: #4a5568;
            font-weight: 600;
            font-size: 15px;
            padding: 8px 18px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            color: #667eea;
            background: #f0f4ff;
        }

        .nav-link.active {
            color: white;
            background: #667eea;
        }

        h1 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 28px;
        }

        h2 {
            color: #764ba2;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: normal;
        }

        .contact-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 24px;
            margin: 16px 0;
            text-align: left;
            border-left: 4px solid #667eea;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin: 14px 0;
            font-size: 15px;
        }

        .contact-item .icon {
            font-size: 22px;
            margin-right: 12px;
            width: 28px;
        }

        .contact-item a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .contact-item a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 24px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Navigation bar -->
        <nav class="navbar" aria-label="Main Navigation">
            <a href="index.html" class="nav-link">Trang chủ</a>
            <a href="about.html" class="nav-link">Giới thiệu</a>
            <a href="contact.html" class="nav-link active">Liên hệ</a>
        </nav>

        <h1>Thông Tin Liên Hệ</h1>
        <h2>Kết nối với tác giả Portfolio</h2>

        <div class="contact-card">
            <div class="contact-item">
                <span class="icon">📧</span>
                <span>Email: <a href="mailto:nguyencongbang2005@gmail.com">nguyencongbang2005@gmail.com</a></span>
            </div>
            <div class="contact-item">
                <span class="icon">🐙</span>
                <span>GitHub: <a href="https://github.com/congbang24" target="_blank">github.com/congbang24</a></span>
            </div>
            <div class="contact-item">
                <span class="icon">📁</span>
                <span>Repository: <a href="https://github.com/congbang24/devops-lab1-portfolio" target="_blank">devops-lab1-portfolio</a></span>
            </div>
            <div class="contact-item">
                <span class="icon">🏫</span>
                <span>Đơn vị: Đại học Công nghệ Thông tin & Truyền thông (ICTU)</span>
            </div>
        </div>

        <div class="footer">
            <p>DevOps Lab 1 — Multi-page Navigation Example</p>
        </div>
    </div>
</body>

</html>
